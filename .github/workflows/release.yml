name: Release Build

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    name: Build and Upload Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Verify
        run: vp run verify

      - name: Build release bundle
        run: |
          VERSION=${{ github.event.release.tag_name || github.ref_name }}
          mkdir -p dist/release/trendpublish-${VERSION}
          cp -R \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            README.md \
            CHANGELOG.md \
            apps \
            dist/dashboard \
            docs \
            migrations \
            packages \
            scripts \
            tests \
            trendpublish.config.example.ts \
            trendpublish.config.docker.example.ts \
            trendpublish.config.cloudflare.ts \
            tsconfig.json \
            vite.config.ts \
            vitest.config.ts \
            wrangler.jsonc \
            dist/release/trendpublish-${VERSION}/
          tar -C dist/release -czf dist/trendpublish-${VERSION}.tar.gz trendpublish-${VERSION}
          sha256sum dist/trendpublish-${VERSION}.tar.gz > dist/trendpublish-${VERSION}.tar.gz.sha256

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ github.event.release.tag_name || github.ref_name }}
          gh release upload "$VERSION" "dist/trendpublish-${VERSION}.tar.gz" --clobber
          gh release upload "$VERSION" "dist/trendpublish-${VERSION}.tar.gz.sha256" --clobber
