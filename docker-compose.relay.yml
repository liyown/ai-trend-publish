services:
  weixin-relay:
    image: ghcr.io/liyown/ai-trend-publish:latest
    container_name: trendpublish-weixin-relay
    restart: unless-stopped
    command: ["vp", "run", "relay"]
    ports:
      - "8080:8080"
    env_file:
      - ./config/.env
    environment:
      PORT: "8080"
    volumes:
      - ./data:/app/data
